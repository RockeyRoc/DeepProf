<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>DeepProf</title>
<style>
:root{font:15px/1.55 system-ui,sans-serif;color:#202b3b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{height:62px;background:#fff;border-bottom:1px solid #e2e7ef;display:flex;align-items:center;padding:0 22px;gap:12px}header b{font-size:19px;color:#285db4}header small{color:#8290a3}.layout{height:calc(100vh - 62px);display:grid;grid-template-columns:270px 1fr}.side{background:#fff;border-right:1px solid #e2e7ef;padding:16px;overflow:auto}.side button,.side select{width:100%;margin-bottom:10px}.main{max-width:920px;width:100%;margin:auto;height:100%;display:flex;flex-direction:column;padding:22px}.toolbar{display:flex;gap:10px;margin-bottom:14px}button,select,input{font:inherit;border:1px solid #d6ddea;border-radius:8px;padding:9px 12px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#285db4;color:white;border-color:#285db4}.sessions{display:grid;gap:5px}.sessions button{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-color:transparent}.sessions button.active{background:#edf3ff;color:#2455a8}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:8px 4px}.bubble{max-width:82%;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid #e1e6ee;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#eaf1ff;border-color:#d7e4ff}.bubble.error{border-color:#e8b8b8;color:#992b2b}.composer{display:flex;gap:9px;padding-top:12px}.composer textarea{flex:1;resize:vertical;min-height:50px;max-height:180px;font:inherit;padding:12px;border:1px solid #d6ddea;border-radius:10px}.config{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:18px}.panel{background:white;width:min(460px,100%);padding:22px;border-radius:14px;display:grid;gap:12px}.panel input,.panel select{width:100%}.hidden{display:none}#status{color:#78869a;font-size:13px;margin-left:auto}@media(max-width:680px){.layout{grid-template-columns:130px 1fr}.side{padding:9px}.main{padding:12px}.toolbar{flex-wrap:wrap}.bubble{max-width:95%}header{padding:0 12px}}
</style></head><body>
<header><b>DeepProf</b><small>本机 AI 伴学</small><span id="status">正在连接本机服务…</span></header>
<div class="layout"><aside class="side"><button id="new" class="primary">＋ 新建对话</button><div id="sessions" class="sessions"></div></aside><main class="main"><div class="toolbar"><select id="provider" aria-label="Provider"></select><select id="model" aria-label="模型"></select><button id="settings">配置模型</button></div><section id="messages" class="messages" aria-live="polite"></section><form id="form" class="composer"><textarea id="input" placeholder="发送消息…（Enter 发送）" required></textarea><button id="send" class="primary">发送</button></form></main></div>
<dialog id="config" class="config"><form id="configForm" class="panel"><h2>配置模型服务</h2><label>服务类型<select id="kind"><option value="glm">智谱 GLM</option><option value="ollama">Ollama</option><option value="custom">自定义 OpenAI 兼容服务</option></select></label><label>Profile ID<input id="profileId" value="default" required></label><label>显示名称<input id="displayName" value="DeepProf Provider" required></label><label>API 地址<input id="baseUrl" value="https://open.bigmodel.cn/api/paas/v4" required></label><label>模型名称<input id="modelName" placeholder="例如 glm-5.3 / qwen3:8b" required></label><label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="Ollama 可留空"></label><div><button type="button" id="closeConfig">取消</button> <button class="primary">保存并连接</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),api=location.origin,client='web-'+crypto.randomUUID();let active='',busy=false,source=null,profiles=[],activeSequence=0,finishTurn=()=>{};
function command(type,payload={},session_id=null){return fetch(api+'/commands',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command_id:'cmd_'+crypto.randomUUID(),client_id:client,surface:'web',session_id,learner_id:'local',type,payload,timestamp:new Date().toISOString()})}).then(async r=>{let v=await r.json();if(!r.ok)throw Error(v?.error?.message||v?.detail?.message||v?.detail||`请求失败 ${r.status}`);return v})}
async function get(path){let r=await fetch(api+path);let d=await r.json();if(!r.ok)throw Error(d?.error?.message||'请求失败');return d}
function bubble(role,text,cls=''){let n=document.createElement('article');n.className='bubble '+(role==='user'?'user ':'')+cls;n.textContent=text;$('#messages').append(n);$('#messages').scrollTop=$('#messages').scrollHeight;return n}
async function loadProviders(){profiles=await get('/providers');$('#provider').replaceChildren(...profiles.map(p=>new Option(`${p.display_name||p.profile_id} · ${p.protocol}`,p.profile_id)));if(profiles.length){$('#provider').value=profiles[0].profile_id;await loadModels(profiles[0].profile_id)}else{$('#model').replaceChildren(new Option('请先配置模型',''));$('#config').showModal()}}
async function loadModels(id,preferred=''){let p=profiles.find(x=>x.profile_id===id);let found=[];try{found=await get(`/providers/${encodeURIComponent(id)}/models`)}catch{}let names=[...new Set([...(p?.models||[]),...found,...(p?.default_model?[p.default_model]:[])])];$('#model').replaceChildren(...names.map(x=>new Option(x,x)));if(preferred&&!names.includes(preferred))$('#model').add(new Option(preferred,preferred));$('#model').value=preferred||p?.default_model||names[0]||''}
async function loadSessions(){let all=await get('/sessions?learner_id=local');$('#sessions').replaceChildren(...all.filter(s=>s.session_mode==='chat').map(s=>{let b=document.createElement('button');b.textContent=s.title||s.session_id;b.className=s.session_id===active?'active':'';b.onclick=()=>selectSession(s.session_id);return b}))}
async function selectSession(id){active=id;source?.close();source=null;$('#messages').replaceChildren();await command('session.resume',{},id).catch(()=>{});let [items,session]=await Promise.all([get(`/sessions/${encodeURIComponent(id)}/messages`),get(`/sessions/${encodeURIComponent(id)}`)]);activeSequence=session.last_sequence||0;for(let m of items)if(m.role==='user'||m.role==='assistant')bubble(m.role,m.content);$('#provider').value=session.provider_profile||$('#provider').value;await loadModels($('#provider').value,session.model||'');loadSessions()}
$('#provider').onchange=async()=>{await loadModels($('#provider').value);if(active&&$('#model').value){try{await command('session.model.set',{profile_id:$('#provider').value,model:$('#model').value},active)}catch(e){$('#status').textContent=e.message}}};
$('#model').onchange=async()=>{if(!active)return;try{let r=await command('session.model.set',{profile_id:$('#provider').value,model:$('#model').value},active);$('#status').textContent=`已切换至 ${r.result?.provider_profile}/${r.result?.model}`}catch(e){$('#status').textContent=e.message}};
$('#new').onclick=async()=>{try{let x=await command('session.new',{title:'常规对话',session_mode:'chat'});await loadSessions();await selectSession(x.session_id)}catch(e){bubble('assistant',e.message,'error')}};
$('#form').onsubmit=async e=>{e.preventDefault();if(busy||!active){if(!active)$('#new').click();return}let text=$('#input').value.trim();if(!text)return;$('#input').value='';bubble('user',text);let answer=bubble('assistant','');busy=true;$('#send').textContent='停止';let finished=false;finishTurn=()=>{finished=true};try{source=new EventSource(`${api}/sessions/${encodeURIComponent(active)}/events?from_sequence=${activeSequence}`);source.addEventListener('model.stream.delta',e=>{let d=JSON.parse(e.data);activeSequence=Math.max(activeSequence,d.sequence||0);if(d.payload?.text)answer.textContent+=d.payload.text;$('#messages').scrollTop=$('#messages').scrollHeight});source.addEventListener('conversation.turn.completed',e=>{activeSequence=Math.max(activeSequence,JSON.parse(e.data).sequence||0);finishTurn();source?.close();source=null;loadSessions()});source.addEventListener('agent.failed',e=>{let d=JSON.parse(e.data);activeSequence=Math.max(activeSequence,d.sequence||0);answer.classList.add('error');answer.textContent+=d.payload?.error?.message||'模型调用失败';finishTurn();source?.close();source=null});await new Promise((resolve,reject)=>{source.onopen=resolve;source.onerror=()=>{if(source?.readyState===EventSource.CLOSED)reject(Error('本机事件流连接中断'))}});await command('message.send',{content:text,requested_action:'chat'},active);$('#status').textContent='DeepProf 正在思考…';let started=Date.now();while(!finished&&Date.now()-started<180000)await new Promise(r=>setTimeout(r,250));if(!finished){answer.classList.add('error');answer.textContent+='\n等待超时，可以重试。'}else $('#status').textContent='就绪'}catch(err){answer.classList.add('error');answer.textContent=err.message}finally{source?.close();source=null;busy=false;$('#send').textContent='发送'}};
$('#send').onclick=e=>{if(busy){e.preventDefault();command('turn.cancel',{},active).catch(()=>{});finishTurn();source?.close();source=null;busy=false;$('#send').textContent='发送'}};$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}};
$('#settings').onclick=()=>$('#config').showModal();$('#closeConfig').onclick=()=>$('#config').close();$('#kind').onchange=()=>{$('#baseUrl').value=$('#kind').value==='ollama'?'http://127.0.0.1:11434/v1':$('#kind').value==='glm'?'https://open.bigmodel.cn/api/paas/v4':''};
$('#configForm').onsubmit=async e=>{e.preventDefault();let kind=$('#kind').value,id=$('#profileId').value.trim(),url=$('#baseUrl').value.trim(),model=$('#modelName').value.trim(),key=$('#apiKey').value;try{let body={profile_id:id,display_name:$('#displayName').value,protocol:kind==='ollama'?'local':'openai_compatible',base_url:url,default_model:model,models:[model],api_key:key||null};let r=await fetch(`${api}/providers/${encodeURIComponent(id)}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok){let d=await r.json();throw Error(d?.error?.message||d?.detail?.message||'保存失败')}r=await fetch(`${api}/providers/default`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({role:'tutor.default',profile_id:id,model})});if(!r.ok)throw Error('保存默认模型失败');profiles=await get('/providers');$('#config').close();$('#apiKey').value='';await loadProviders();$('#provider').value=id;await loadModels(id,model);$('#status').textContent=`已配置 ${id}/${model}`}catch(err){$('#status').textContent=err.message}};
async function start(){try{await loadProviders();let selected=await get('/providers/default');if(profiles.some(p=>p.profile_id===selected.profile_id)){ $('#provider').value=selected.profile_id;await loadModels(selected.profile_id,selected.model)}let all=await get('/sessions?learner_id=local'),last=all.find(s=>s.session_mode==='chat');if(last)await selectSession(last.session_id);else $('#status').textContent='配置模型后，新建对话即可开始';}catch(e){$('#status').textContent=e.message}}
start();
</script></body></html>
