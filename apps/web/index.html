<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="DeepProf 本机网页聊天：会话与模型服务都由本机 Gateway 提供。">
<title>DeepProf</title>
<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  color-scheme:light;
  /* 纸面与层次 */
  --paper:#ffffff;
  --surface:#f7f8f9;
  --sunk:#f0f1f3;
  --ink:#0f1115;
  --ink-2:#414750;
  --muted:#6b7280;
  --decor:#8a919c;
  --rule:#e9ebee;
  --rule-2:#d7dbe1;
  /* 品牌 */
  --brand:#0765fc;
  --brand-ink:#0b4fc4;
  --brand-wash:#eef4ff;
  --danger:#b3261e;
  --danger-wash:#fdeceb;
  --ok:#1b7f4b;
  /* 字族：界面与正文全用系统字族，衬线只留给 DeepProf 字标 */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  /* 圆角按角色分级，不是一个半径套所有 */
  --r-xs:6px;
  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
  --r:10px;
  --r-pill:999px;
  /* 阴影只给浮起来的层：输入区、弹窗 */
  --sh-1:0 1px 2px rgba(15,23,42,.05);
  --sh-2:0 4px 14px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);
  --sh-3:0 20px 50px rgba(15,23,42,.16);
  --topbar:56px;
  --rail:272px;
  --measure:46rem;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1f2124;
  --surface:#17181b;
  --sunk:#2c2e33;
  --ink:#eceef1;
  --ink-2:#c3c7cd;
  --muted:#939aa4;
  --decor:#767d87;
  --rule:#2b2d32;
  --rule-2:#3a3d44;
  --brand:#5b9bff;
  --brand-ink:#8fbbff;
  --brand-wash:#1b2740;
  --danger:#ff8a80;
  --danger-wash:#2c1a19;
  --ok:#5fd39a;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 4px 16px rgba(0,0,0,.34),0 1px 2px rgba(0,0,0,.24);
  --sh-3:0 20px 50px rgba(0,0,0,.5);
}

html,body{height:100%}
body{
  margin:0;
  font-family:var(--sans);
  font-size:15px;
  line-height:1.68;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand-ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:10px;z-index:99;background:var(--surface);border:1px solid var(--rule-2);padding:8px 12px;border-radius:var(--r-sm)}

/* 细滚动条：去掉默认的箭头块 */
.scroll,.rail-body,.dlg-body{scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:var(--r-pill);border:4px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--decor);background-clip:content-box}

/* ---------- 顶栏 ---------- */
.topbar{
  height:var(--topbar);
  display:flex;align-items:center;gap:12px;
  padding:0 14px;
  background:var(--surface);
  border-bottom:1px solid var(--rule);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand .tick{width:18px;height:2px;background:var(--brand);border-radius:var(--r-pill);align-self:center;flex:none}
.brand .word{font-family:var(--serif);font-size:18px;letter-spacing:.012em;color:var(--ink);white-space:nowrap}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--decor);flex:none}
.status[data-state="ready"] .dot{background:var(--ok)}
.status[data-state="busy"] .dot{background:var(--brand);animation:pulse 1.4s ease-in-out infinite}
.status[data-state="error"] .dot{background:var(--danger)}
.status .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.status[data-state="busy"] .dot{animation:none}}

.iconbtn{
  width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;
  background:none;border:1px solid transparent;border-radius:var(--r-sm);
  color:var(--muted);cursor:pointer;
  transition:background .14s ease,color .14s ease;
}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn svg{width:16px;height:16px;display:block}

/* ---------- 通用控件 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 15px;border:1px solid var(--rule-2);border-radius:var(--r-sm);
  background:var(--paper);color:var(--ink);cursor:pointer;
  transition:background .14s ease,border-color .14s ease,transform .1s ease;
}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
:root[data-theme="dark"] .btn.primary{color:#08111f}
.btn.stop{background:var(--danger);border-color:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.stop{color:#1b0f0e}
.link{background:none;border:0;color:var(--brand-ink);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 8px;border-radius:var(--r-xs)}
.link:hover{background:var(--sunk)}

/* ---------- 骨架 ---------- */
.shell{
  display:grid;
  grid-template-columns:var(--rail) minmax(0,1fr);
  height:calc(100vh - var(--topbar));
  height:calc(100dvh - var(--topbar));
}
.rail{
  background:var(--surface);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;min-height:0;
}
.rail-head{padding:12px 12px 8px}
.rail-body{flex:1;overflow-y:auto;padding:4px 8px 14px}
.rail-foot{padding:11px 14px;border-top:1px solid var(--rule);font-size:11.5px;line-height:1.55;color:var(--muted)}

/* 新建按钮：整行可点，不再是描边大块 */
#new{
  justify-content:flex-start;gap:9px;
  width:100%;padding:9px 12px;
  background:none;border-color:transparent;
  font-size:14px;border-radius:var(--r-sm);
}
#new:hover{background:var(--sunk);border-color:transparent}
#new svg{opacity:.75}

.slist{display:flex;flex-direction:column;gap:1px}
.sgroup{
  font-size:11.5px;color:var(--muted);
  padding:14px 12px 5px;letter-spacing:.02em;
}
.sitem{
  display:flex;align-items:center;gap:8px;
  width:100%;text-align:left;background:none;border:0;
  padding:8px 12px;border-radius:var(--r-sm);
  color:var(--ink-2);cursor:pointer;
  transition:background .14s ease,color .14s ease;
}
.sitem:hover{background:var(--sunk)}
.sitem[aria-current="true"]{background:var(--brand-wash);color:var(--ink)}
.sitem .t{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .m{flex:none;font-size:11.5px;color:var(--muted);opacity:0;transition:opacity .14s ease}
.sitem:hover .m,.sitem:focus-visible .m,.sitem[aria-current="true"] .m{opacity:1}
.slist .none{padding:14px 12px;font-size:12.5px;color:var(--muted)}

.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.stage-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 18px;border-bottom:1px solid var(--rule);background:var(--paper);
}
.stage-head .title{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:26ch}
.stage-head .spacer{margin-left:auto}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
select{
  background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r-sm);
  padding:5px 8px;max-width:200px;font-size:13px;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--decor)}
select:disabled{opacity:.55;cursor:not-allowed}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.doc{max-width:var(--measure);margin:0 auto;padding:30px 24px 36px}

/* ---------- 对话：用户气泡右对齐，回复通栏 ---------- */
.turn{display:block;margin:0 0 22px}
.turn.user{display:flex;justify-content:flex-end}
/* 角色标签保留在无障碍树里（屏幕阅读器仍能读出谁说的），可见语义交给对齐与底色 */
.turn.user .who,.turn.assistant .who{
  position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;
}
.turn .body{min-width:0}
.turn.user .body{
  max-width:min(80%,32rem);
  background:var(--sunk);
  border-radius:var(--r-lg) var(--r-lg) var(--r-xs) var(--r-lg);
  padding:11px 15px;
}
.turn .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.turn.system{margin:0 0 18px}
.turn.system .who{font-size:11px;color:var(--muted);margin-bottom:2px}
.sysnote{
  font-size:12.5px;color:var(--muted);
  border-left:2px solid var(--rule-2);padding-left:11px;
}

.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .85em}
.md h3,.md h4,.md h5,.md h6{font-weight:650;letter-spacing:-.005em;line-height:1.35;margin:1.35em 0 .5em}
.md h3{font-size:18px}
.md h4{font-size:16.5px}
.md h5,.md h6{font-size:15px}
.md ul,.md ol{margin:0 0 .85em;padding-left:1.45em}
.md li{margin:.22em 0}
.md li::marker{color:var(--decor)}
.md li>ul,.md li>ol{margin-bottom:0}
.md code{font-family:var(--mono);font-size:.87em;background:var(--sunk);border-radius:var(--r-xs);padding:2px 6px}
.md pre{
  position:relative;
  background:var(--sunk);border-radius:var(--r-md);
  padding:34px 14px 14px;overflow-x:auto;margin:0 0 .85em;
}
/* 语言标签从 data-lang 生成，不往 DOM 里塞东西 */
.md pre[data-lang]::before{
  content:attr(data-lang);
  position:absolute;top:0;left:0;right:0;
  padding:7px 14px;font-family:var(--mono);font-size:11px;color:var(--muted);
  border-bottom:1px solid var(--rule);pointer-events:none;
}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.62;white-space:pre}
.md blockquote{margin:0 0 .85em;padding:1px 0 1px 14px;border-left:2px solid var(--rule-2);color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--rule);margin:1.3em 0}
.md .tw{overflow-x:auto;margin:0 0 .85em}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th,.md td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--sunk);font-weight:600}
.cur{display:inline-block;width:7px;height:1.05em;background:var(--brand);vertical-align:-2px;margin-left:2px;border-radius:1px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.errbox{margin-top:10px;border:1px solid var(--danger);background:var(--danger-wash);border-radius:var(--r-sm);padding:10px 13px}
.errbox .h{font-size:11.5px;color:var(--danger);margin-bottom:3px}
.errbox .b{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.more{display:flex;justify-content:center;padding:0 0 22px}
.more button{background:var(--sunk);border-radius:var(--r-pill);padding:6px 14px;text-decoration:none}
.more button:hover{background:var(--rule)}

.empty{max-width:32rem;margin:0 auto;padding:64px 24px}
.empty .word{font-family:var(--serif);font-size:32px;letter-spacing:.01em;line-height:1.2}
.empty .lead{margin:12px 0 0;color:var(--ink-2)}
.empty ul{margin:18px 0 0;padding-left:1.4em;color:var(--muted);font-size:13.5px}
.empty li{margin:.3em 0}
.notice{
  margin:18px 0 0;border:1px solid var(--rule-2);background:var(--surface);
  border-radius:var(--r-md);padding:14px 16px;
}
.notice .h{font-size:13px;color:var(--ink);margin-bottom:5px}
.notice .b{font-size:13px;color:var(--ink-2);margin:0}
.notice code{
  font-family:var(--mono);font-size:12.5px;background:var(--sunk);
  border-radius:var(--r-xs);padding:2px 6px;white-space:nowrap;
}

/* ---------- 输入区：一颗圆角容器把输入和按钮收进去 ---------- */
.composer{background:var(--paper);padding:0 24px 20px}
.composer-in{
  max-width:var(--measure);margin:0 auto;
  display:flex;align-items:flex-end;gap:8px;
  background:var(--surface);
  border:1px solid var(--rule-2);border-radius:var(--r-lg);
  box-shadow:var(--sh-2);
  padding:8px 8px 8px 16px;
  transition:border-color .14s ease,box-shadow .14s ease;
}
.composer-in:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-wash),var(--sh-2)}
#input{
  display:block;flex:1;min-width:0;min-height:26px;max-height:200px;resize:none;overflow-y:auto;
  padding:4px 0;line-height:1.6;
  border:0;background:none;
}
#input:focus{outline:none;box-shadow:none}
#input::placeholder{color:var(--muted)}
#send{flex:none;border-radius:var(--r-sm);padding:8px 16px}
.cfoot{max-width:var(--measure);margin:9px auto 0;display:flex;align-items:center;gap:10px}
.hint{font-size:11.5px;color:var(--muted)}
.cfoot .spacer{margin-left:auto}

/* ---------- 配置面板 ---------- */
dialog{
  border:1px solid var(--rule-2);border-radius:var(--r-lg);padding:0;margin:auto;
  background:var(--paper);color:var(--ink);
  width:min(560px,calc(100vw - 28px));max-height:min(90vh,90dvh);
  box-shadow:var(--sh-3);
}
dialog::backdrop{background:rgba(12,18,32,.44)}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-head{padding:18px 22px 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dlg-head h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.005em}
.dlg-head .sub{font-size:12px;color:var(--muted)}
.dlg-body{padding:2px 22px 18px;overflow-y:auto;flex:1}
.dlg-foot{padding:14px 22px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dlg-foot .spacer{margin-left:auto}
.grid{display:grid;gap:13px}
.grid.two{grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;color:var(--muted)}
.f input,.f select{
  width:100%;max-width:none;padding:9px 11px;
  border:1px solid var(--rule-2);border-radius:var(--r-sm);background:var(--paper);
}
.f input:hover,.f select:hover{border-color:var(--decor)}
.f input:focus,.f select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-wash)}
.tip{margin:15px 0 0;font-size:11.5px;line-height:1.6;color:var(--muted)}
.probe{margin-top:13px;border-radius:var(--r-sm);padding:11px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.probe .k{color:var(--ink);margin-bottom:2px}
.probe .dim{color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.dlg-foot .err{font-size:12px;color:var(--danger);max-width:100%}

.scrim{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{
    position:fixed;top:var(--topbar);bottom:0;left:0;width:min(310px,86vw);
    transform:translateX(-101%);transition:transform .2s ease;z-index:40;
    box-shadow:var(--sh-3);
  }
  body.nav-open .rail{transform:none}
  .scrim{display:block;position:fixed;inset:var(--topbar) 0 0;z-index:35;background:rgba(12,18,32,.34);opacity:0;pointer-events:none;transition:opacity .2s ease}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .doc{padding:20px 16px 28px}
  .empty{padding:44px 18px}
  .composer{padding:0 14px 14px}
  .composer-in{padding:7px 7px 7px 13px;border-radius:var(--r-md)}
  .stage-head{padding:8px 14px;gap:8px}
  .stage-head .title{max-width:100%}
  .status .txt{max-width:18ch}
  .turn.user .body{max-width:92%}
  #menu{display:grid}
}
@media (min-width:861px){#menu{display:none}}
@media (prefers-reduced-motion:reduce){
  .rail,.scrim,.btn,.sitem,.composer-in,.iconbtn{transition:none}
  .btn:active{transform:none}
}
@media print{
  .topbar,.rail,.composer,.field,.iconbtn,.more,.scrim{display:none}
  .shell{display:block;height:auto}
  .scroll{overflow:visible}
  .turn.user .who,.turn.assistant .who{position:static;width:auto;height:auto;clip-path:none}
}
</style>
</head>
<body>
<a class="skip" href="#input">跳到输入框</a>

<header class="topbar">
  <button class="iconbtn" id="menu" type="button" aria-label="打开会话列表" aria-expanded="false" aria-controls="rail">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
  </button>
  <div class="brand">
    <span class="tick" aria-hidden="true"></span>
    <span class="word">DeepProf</span>
    <span class="sub">本机网页聊天</span>
  </div>
  <div class="status" id="status" data-state="conn" role="status">
    <span class="dot" aria-hidden="true"></span>
    <span class="txt" id="statusText">正在连接本机服务…</span>
  </div>
  <button class="iconbtn" id="theme" type="button" aria-label="配色：跟随系统">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="5.4"/><path d="M8 2.6a5.4 5.4 0 0 1 0 10.8z" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="iconbtn" id="settings" type="button" aria-label="配置模型服务">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6L3.5 3.5" stroke-linecap="round"/></svg>
  </button>
</header>

<div class="shell">
  <aside class="rail" id="rail" aria-label="会话">
    <div class="rail-head">
      <button class="btn" id="new" type="button">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>
        新建对话
      </button>
    </div>
    <div class="rail-body">
      <nav class="slist" id="sessions" aria-label="会话列表"></nav>
    </div>
    <div class="rail-foot">本页只走普通对话路径；教学策略、教材检索与学情更新不会从这里进入。</div>
  </aside>

  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <main class="stage">
    <div class="stage-head">
      <span class="title" id="sessionTitle">未选择会话</span>
      <span class="spacer"></span>
      <label class="field">模型服务

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var api = location.origin;
  // 只有在 http(s) 下打开才能连上 Gateway：直接双击本地文件打开时 origin 是 "null"，所有请求必然失败
  var SERVED = location.protocol === 'http:' || location.protocol === 'https:';
  var client = uid('web-');

  // crypto.randomUUID 只在安全上下文里存在；用局域网 IP 打开本页时会没有，不能让它把命令全弄挂
  function uid(prefix) {
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return prefix + window.crypto.randomUUID();
      }
    } catch (e) { /* 取不到就走下面的回退 */ }
    return prefix + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  var active = '';
  var busy = false;
  var source = null;
  var profiles = [];
  var lastSeq = 0;
  var msgLimit = 200;
  var stick = true;
  var abortTurn = null;
  var NOT_SERVED = '本页需要通过 deepprof web 打开。直接打开这个 HTML 文件时，它连不上本机服务——页面里的数据和模型调用全部来自本机 Gateway。';

  /* ---------- 基础工具 ---------- */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  var ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return ESCAPES[c]; });
  }

  function safeParse(text) {
    try { return JSON.parse(text); } catch (e) { return null; }
  }

  async function readBody(r) {
    var text = '';
    try { text = await r.text(); } catch (e) { text = ''; }
    var data = text ? safeParse(text) : null;
    return { data: data, text: text };
  }

  function pickError(data, status) {
    var raw = data && (data.error !== undefined ? data.error : data.detail);
    var message = '';
    var code = '';
    if (typeof raw === 'string') {
      message = raw;
    } else if (raw && typeof raw === 'object') {
      message = typeof raw.message === 'string' ? raw.message : '';
      code = String(raw.code || (raw.details && raw.details.kind) || '');
      if (!message && Array.isArray(raw.errors)) {
        message = raw.errors.map(function (x) { return (x && x.msg) || ''; }).filter(Boolean).join('；');
      }
    }
    return { message: message || ('请求失败（HTTP ' + status + '）'), code: code };
  }

  function fail(data, status) {
    var info = pickError(data, status);
    var err = new Error(info.message);
    err.code = info.code;
    err.status = status;
    return err;
  }

  /* ---------- 网络 ---------- */

  // fetch 只在「请求根本没到服务端」时抛 TypeError（连接被拒、协议不对、被拦截），
  // 这时浏览器给的是英文 Failed to fetch，直接抛给用户看不懂，统一译成中文
  async function raw(path, init) {
    try {
      return await fetch(api + path, init);
    } catch (e) {
      throw new Error(SERVED
        ? '连不上本机服务（' + api + '）。请确认 deepprof web 还在运行，窗口没有被关掉。'
        : NOT_SERVED);
    }
  }

  function command(type, payload, session_id) {
    var body = {
      command_id: uid('cmd_'),
      client_id: client,
      surface:'web',
      session_id: session_id === undefined ? null : session_id,
      learner_id: 'local',
      type: type,
      payload: payload || {},
      timestamp: new Date().toISOString()
    };
    return raw('/commands', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(async function (r) {
      var out = await readBody(r);
      if (!r.ok) throw fail(out.data, r.status);
      if (out.data === null) throw new Error('本机服务返回了非 JSON 响应');
      return out.data;
    });
  }

  async function get(path) {
    var r = await raw(path);
    var out = await readBody(r);
    if (!r.ok) throw fail(out.data, r.status);
    if (out.data === null) throw new Error('本机服务返回了非 JSON 响应');
    return out.data;
  }

  /* ---------- 配色 ---------- */

  var THEME_KEY = 'deepprof.web.theme';
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var themePref = 'auto';
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === 'auto' || saved === 'light' || saved === 'dark') themePref = saved;
  } catch (e) { /* 隐私模式下不可用，退回跟随系统 */ }

  var THEME_LABEL = { auto: '配色：跟随系统', light: '配色：浅色', dark: '配色：深色' };

  function applyTheme() {
    var dark = themePref === 'dark' || (themePref === 'auto' && !!(mq && mq.matches));
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var btn = $('#theme');
    if (btn) btn.setAttribute('aria-label', THEME_LABEL[themePref] + '（点击切换）');
  }

  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function () { if (themePref === 'auto') applyTheme(); });
  }

  $('#theme').addEventListener('click', function () {
    themePref = themePref === 'auto' ? 'light' : themePref === 'light' ? 'dark' : 'auto';
    try { localStorage.setItem(THEME_KEY, themePref); } catch (e) { /* 忽略 */ }
    applyTheme();
  });

  /* ---------- Markdown（先转义再解析，绝不注入原始 HTML） ---------- */

  function inline(raw) {
    // raw 必须先整体转义，之后插入的才是我们自己构造的标签
    var text = esc(raw);
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (m, c) {
      codes.push(c);
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    text = text.replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, function (m, label, url) {
      var href = /^(https?:|mailto:)/i.test(url) ? url : '';
      if (!href) return label;
      return '<a href="' + href.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    });
    text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    text = text.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    text = text.replace(/\u0000(\d+)\u0000/g, function (m, i) { return '<code>' + codes[Number(i)] + '</code>'; });
    return text;
  }

  function isRule(line) {
    return /^\s{0,3}([-*_])\s*\1\s*\1[\s\1]*$/.test(line);
  }
  function isFence(line) {
    return /^\s{0,3}(```|~~~)/.test(line);
  }
  function isTableSep(line) {
    return /^\s*\|?[\s:|-]*-[\s:|-]*\|[\s:|-]*$/.test(line) && line.indexOf('|') !== -1;
  }
  function splitRow(line) {
    var s = line.trim().replace(/^\|/, '').replace(/\|$/, '');
    return s.split('|').map(function (c) { return c.trim(); });
  }

  function renderList(lines, start) {
    var items = [];
    var i = start;
    while (i < lines.length) {
      var m = lines[i].match(/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/);
      if (!m) break;
      items.push({ indent: m[1].replace(/\t/g, '  ').length, ordered: /\d/.test(m[2]), text: m[3] });
      i += 1;
      while (i < lines.length && lines[i].trim() && !/^\s*([-*+]|\d{1,9}[.)])\s+/.test(lines[i]) && /^\s{2,}/.test(lines[i])) {
        items[items.length - 1].text += '\n' + lines[i].trim();
        i += 1;
      }
    }
    var html = '';
    // 每一层各自记住自己的 <li> 有没有闭合：嵌套列表必须留在上一层的 <li> 里面，
    // 否则会生成 <ul><li>a</li><ul>… 这种非法结构（ul 直接嵌 ul），浏览器渲染会错位
    var stack = [];
    var closeLi = function () {
      var top = stack[stack.length - 1];
      if (top && top.liOpen) { html += '</li>'; top.liOpen = false; }
    };
    var closeList = function () {
      closeLi();
      var top = stack.pop();
      html += top.ordered ? '</ol>' : '</ul>';
    };
    var openList = function (item) {
      stack.push({ indent: item.indent, ordered: item.ordered, liOpen: false });
      html += item.ordered ? '<ol>' : '<ul>';
    };
    for (var k = 0; k < items.length; k += 1) {
      var it = items[k];
      while (stack.length && it.indent < stack[stack.length - 1].indent) closeList();
      if (!stack.length || it.indent > stack[stack.length - 1].indent) openList(it);
      else if (stack[stack.length - 1].ordered !== it.ordered) { closeList(); openList(it); }
      else closeLi();
      html += '<li>' + inline(it.text).replace(/\n/g, '<br>');
      stack[stack.length - 1].liOpen = true;
    }
    while (stack.length) closeList();
    return { html: html, next: i };
  }

  function md(src) {
    var lines = String(src === undefined || src === null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
    var html = '';
    var para = [];
    var i = 0;

    function flush() {
      if (!para.length) return;
      html += '<p>' + inline(para.join('\n')).replace(/\n/g, '<br>') + '</p>';
      para = [];
    }

    while (i < lines.length) {
      var line = lines[i];

      if (isFence(line)) {
        var lang = line.trim().replace(/^(```|~~~)/, '').trim();
        var buf = [];
        i += 1;
        while (i < lines.length && !/^\s{0,3}(```|~~~)\s*$/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1; // 跳过结束围栏；流式未闭合时直接到末尾
        flush();
        html += '<pre' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' + esc(buf.join('\n')) + '</code></pre>';
        continue;
      }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flush();
        var lv = Math.min(h[1].length + 2, 6);
        html += '<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>';
        i += 1;
        continue;
      }

      if (isRule(line)) { flush(); html += '<hr>'; i += 1; continue; }

      if (line.indexOf('|') !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        flush();
        var head = splitRow(line);
        i += 2;
        var rows = [];
        while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim()) { rows.push(splitRow(lines[i])); i += 1; }
        var t = '<div class="tw"><table><thead><tr>';
        for (var a = 0; a < head.length; a += 1) t += '<th>' + inline(head[a]) + '</th>';
        t += '</tr></thead><tbody>';
        for (var b = 0; b < rows.length; b += 1) {
          t += '<tr>';
          for (var c = 0; c < rows[b].length; c += 1) t += '<td>' + inline(rows[b][c]) + '</td>';
          t += '</tr>';
        }
        html += t + '</tbody></table></div>';
        continue;
      }

      if (/^\s{0,3}>\s?/.test(line)) {
        flush();
        var q = [];
        while (i < lines.length && /^\s{0,3}>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s{0,3}>\s?/, '')); i += 1; }
        html += '<blockquote>' + md(q.join('\n')) + '</blockquote>';
        continue;
      }

      if (/^\s*([-*+]|\d{1,9}[.)])\s+/.test(line)) {
        flush();
        var res = renderList(lines, i);
        html += res.html;
        i = res.next;
        continue;
      }

      if (!line.trim()) { flush(); i += 1; continue; }

      para.push(line);
      i += 1;
    }
    flush();
    return html;
  }

  /* ---------- 状态与滚动 ---------- */

  var STATUS_TEXT = {
    conn: '正在连接本机服务…',
    ready: '就绪',
    busy: 'DeepProf 正在思考…'
  };

  function setStatus(state, text) {
    var box = $('#status');
    box.dataset.state = state;
    $('#statusText').textContent = text || STATUS_TEXT[state] || '';
  }

  var scrollEl = $('#scroll');
  scrollEl.addEventListener('scroll', function () {
    stick = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 60;
  }, { passive: true });

  function toBottom() {
    if (stick) scrollEl.scrollTop = scrollEl.scrollHeight;
  }

  function autoGrow() {
    var t = $('#input');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 200) + 'px';
  }

  /* ---------- 消息渲染 ---------- */

  var WHO = { user: '你', assistant: 'DeepProf', system: '系统' };

  function turnNode(role, content) {
    var node = el('article', 'turn ' + role);
    node.appendChild(el('div', 'who', WHO[role] || role));
    var body = el('div', 'body');
    node.appendChild(body);
    if (role === 'assistant') {
      body.appendChild(el('div', 'md'));
    } else if (role === 'system') {
      body.appendChild(el('div', 'sysnote', content));
    } else {
      body.appendChild(el('div', 'txt', content));
    }
    return node;
  }

  function usageLine(usage) {
    var total = Number(usage.total_tokens || 0);
    if (!total) return '';
    var parts = ['本轮 ' + total + ' tokens'];
    if (usage.prompt_tokens) parts.push('输入 ' + usage.prompt_tokens);
    if (usage.completion_tokens) parts.push('输出 ' + usage.completion_tokens);
    return parts.join(' · ');
  }

  var GUIDE = [
    '本页只走普通对话路径；教学策略、教材检索与学情更新不会从这里进入。',
    '模型调用使用你在「配置模型服务」中登记的服务。',
    'Enter 发送，Shift+Enter 换行；生成中按 Esc 取消。'
  ];

  function showEmpty(notice) {
    var box = $('#messages');
    box.replaceChildren();
    var d = el('div', 'empty');
    d.appendChild(el('div', 'word', 'DeepProf'));
    if (notice) {
      d.appendChild(el('p', 'lead', '还没有连上本机服务。'));
      var card = el('div', 'notice');
      card.appendChild(el('div', 'h', '在 PowerShell 里运行：'));
      var line = el('p', 'b');
      line.appendChild(el('code', null, 'deepprof web'));
      card.appendChild(line);
      card.appendChild(el('p', 'b', notice));
      d.appendChild(card);
    } else {
      d.appendChild(el('p', 'lead', '新建对话即可开始。'));
    }
    var ul = el('ul');
    GUIDE.forEach(function (t) { ul.appendChild(el('li', null, t)); });
    d.appendChild(ul);
    box.appendChild(d);
    $('#sessionTitle').textContent = '未选择会话';
  }

  /* ---------- 会话 ---------- */

  function normalizeIso(s) {
    var v = String(s || '');
    if (!v) return '';
    return /[zZ]|[+-]\d{2}:?\d{2}$/.test(v) ? v : v + 'Z';
  }

  function relTime(iso) {
    var t = Date.parse(normalizeIso(iso));
    if (!isFinite(t)) return '';
    var diff = Date.now() - t;
    if (diff < 0) return '刚刚';
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
    var d = new Date(t);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // 分组以本地日历的今天为界，不是「往前推 24 小时」
  function groupOf(iso) {
    var t = Date.parse(normalizeIso(iso));
    if (!isFinite(t)) return '更早';
    var n = new Date();
    var today = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
    if (t >= today) return '今天';
    if (t >= today - 6 * 86400000) return '近 7 天';
    return '更早';
  }

  function chatSessions(all) {
    var list = Array.isArray(all) ? all.filter(function (s) { return s && s.session_mode === 'chat'; }) : [];
    list.sort(function (a, b) {
      return Date.parse(normalizeIso(b.updated_at)) - Date.parse(normalizeIso(a.updated_at));
    });
    return list;
  }

  async function loadSessions(quiet) {
    var all;
    try {
      all = await get('/sessions?learner_id=local');
    } catch (e) {
      // 列表拉不到必须说出来，不能渲染成「还没有会话」
      var nav0 = $('#sessions');
      if (nav0) nav0.replaceChildren(el('div', 'none', '会话列表加载失败：' + e.message));
      if (!quiet) setStatus('error', '会话列表加载失败：' + e.message);
      return null;
    }
    var chats = chatSessions(all);
    var nav = $('#sessions');
    nav.replaceChildren();
    if (!chats.length) {
      nav.appendChild(el('div', 'none', '还没有会话。'));
      return chats;
    }
    var lastGroup = '';
    chats.forEach(function (s) {
      var g = groupOf(s.updated_at);
      if (g !== lastGroup) {
        lastGroup = g;
        nav.appendChild(el('div', 'sgroup', g));
      }
      var b = el('button', 'sitem');
      b.type = 'button';
      b.setAttribute('aria-current', s.session_id === active ? 'true' : 'false');
      b.appendChild(el('span', 't', s.title || s.session_id));
      b.appendChild(el('span', 'm', relTime(s.updated_at)));
      b.addEventListener('click', function () { selectSession(s.session_id); });
      nav.appendChild(b);
    });
    return chats;
  }

  function closeStream() {
    if (source) {
      try { source.close(); } catch (e) { /* 忽略 */ }
      source = null;
    }
  }

  async function renderHistory(id) {
    var results = await Promise.all([
      get('/sessions/' + encodeURIComponent(id) + '/messages?limit=' + msgLimit),
      get('/sessions/' + encodeURIComponent(id))
    ]);
    var items = Array.isArray(results[0]) ? results[0] : [];
    var session = results[1] || {};
    lastSeq = Number(session.last_sequence || 0);

    var box = $('#messages');
    box.replaceChildren();

    var shown = items.filter(function (m) {
      return m && (m.role === 'user' || m.role === 'assistant' || m.role === 'system');
    });

    if (shown.length && Number(shown[0].index || 0) > 0 && msgLimit < 1000) {
      var more = el('div', 'more');
      var btn = el('button', 'link', '加载更早的消息（还有 ' + shown[0].index + ' 条）');
      btn.type = 'button';
      btn.addEventListener('click', async function () {
        var before = scrollEl.scrollHeight;
        var top = scrollEl.scrollTop;
        msgLimit = Math.min(1000, msgLimit * 2);
        btn.disabled = true;
        await renderHistory(id);
        scrollEl.scrollTop = top + (scrollEl.scrollHeight - before);
      });
      more.appendChild(btn);
      box.appendChild(more);
    }

    shown.forEach(function (m) {
      var node = turnNode(m.role, m.content);
      if (m.role === 'assistant') node.querySelector('.md').innerHTML = md(m.content);
      box.appendChild(node);
    });

    $('#sessionTitle').textContent = session.title || id;
    stick = true;
    scrollEl.scrollTop = scrollEl.scrollHeight;
    return session;
  }

  async function selectSession(id) {
    if (busy) return;
    active = id;
    closeStream();
    msgLimit = 200;
    $('#messages').replaceChildren();
    try { await command('session.resume', {}, id); } catch (e) { /* 恢复失败不阻断查看 */ }
    var session;
    try {
      session = await renderHistory(id);
    } catch (e) {
      setStatus('error', e.message);
      showEmpty();
      return;
    }
    var pid = session.provider_profile;
    if (pid && profiles.some(function (p) { return p.profile_id === pid; })) $('#provider').value = pid;
    await loadModels($('#provider').value, session.model || '');
    setStatus('ready', '就绪');
    loadSessions(true);
  }

  async function newChat() {
    if (busy) return;
    try {
      var created = await command('session.new', { title: '常规对话', session_mode: 'chat' });
      await loadSessions(true);
      await selectSession(created.session_id);
      $('#input').focus();
    } catch (e) {
      setStatus('error', e.message);
    }
  }

  /* ---------- 模型服务 ---------- */

  function openConfig() {
    var dlg = $('#config');
    if (dlg && !dlg.open) dlg.showModal();
    $('#cfgStatus').textContent = '';
    $('#probeOut').hidden = true;
  }
  function closeConfig() {
    var dlg = $('#config');
    if (dlg && dlg.open) dlg.close();
  }

  async function loadProviders() {
    profiles = await get('/providers');
    if (!Array.isArray(profiles)) profiles = [];
    var sel = $('#provider');
    var prev = sel.value;
    sel.replaceChildren();
    profiles.forEach(function (p) {
      sel.add(new Option((p.display_name || p.profile_id) + ' · ' + p.protocol, p.profile_id));
    });
    if (!profiles.length) {
      $('#model').replaceChildren(new Option('请先配置模型服务', ''));
      setStatus('error', '尚未配置模型服务');
      openConfig();
      return false;   // 让调用方停下，别把告警覆盖成「就绪」
    }
    var pick = profiles.some(function (p) { return p.profile_id === prev; }) ? prev : profiles[0].profile_id;
    sel.value = pick;
    await loadModels(pick);
    return true;
  }

  async function loadModels(id, preferred) {
    preferred = preferred || '';
    var p = profiles.filter(function (x) { return x.profile_id === id; })[0];
    var found = [];
    try {
      var got = await get('/providers/' + encodeURIComponent(id) + '/models');
      if (Array.isArray(got)) found = got;
    } catch (e) { /* 探测不到模型列表时退回已登记的名称 */ }
    var names = [];
    [].concat((p && p.models) || [], found, p && p.default_model ? [p.default_model] : []).forEach(function (n) {
      if (n && names.indexOf(n) === -1) names.push(n);
    });
    var sel = $('#model');
    sel.replaceChildren();
    names.forEach(function (n) { sel.add(new Option(n, n)); });
    if (preferred && names.indexOf(preferred) === -1) sel.add(new Option(preferred, preferred));
    sel.value = preferred || (p && p.default_model) || names[0] || '';
  }

  $('#provider').addEventListener('change', async function () {
    await loadModels($('#provider').value);
    if (!active || !$('#model').value) return;
    try {
      await command('session.model.set', { profile_id: $('#provider').value, model: $('#model').value }, active);
      setStatus('ready', '已切换至 ' + $('#provider').value + ' / ' + $('#model').value);
    } catch (e) {
      setStatus('error', e.message);
    }
  });

  $('#model').addEventListener('change', async function () {
    if (!active) return;
    try {
      var r = await command('session.model.set', { profile_id: $('#provider').value, model: $('#model').value }, active);
      var res = (r && r.result) || {};
      setStatus('ready', '已切换至 ' + (res.provider_profile || $('#provider').value) + ' / ' + (res.model || $('#model').value));
    } catch (e) {
      setStatus('error', e.message);
    }
  });

  /* ---------- 一轮对话 ---------- */

  function paintMd(target, text, streaming) {
    target.innerHTML = md(text);
    if (streaming) target.appendChild(el('span', 'cur'));
  }

  async function runTurn(text) {
    busy = true;
    abortTurn = null;
    setStatus('busy', STATUS_TEXT.busy);
    $('#send').textContent = '停止';
    $('#send').classList.remove('primary');
    $('#send').classList.add('stop');
    $('#messages').setAttribute('aria-busy', 'true');

    var node = turnNode('assistant', '');
    var body = node.querySelector('.body');
    var mdEl = node.querySelector('.md');
    $('#messages').appendChild(node);
    toBottom();

    var acc = '';
    var usage = null;
    var finished = false;
    var timer = 0;
    var watchdog = 0;

    function paintStreaming() {
      timer = 0;
      paintMd(mdEl, acc, true);
      toBottom();
    }
    function schedule() {
      if (!timer) timer = setTimeout(paintStreaming, 90);
    }
    function bump() {
      if (watchdog) clearTimeout(watchdog);
      watchdog = setTimeout(function () { finish('failed', '长时间没有收到本机事件，已停止等待。'); }, 180000);
    }

    function finish(state, detail) {
      if (finished) return;
      finished = true;
      abortTurn = null;
      if (timer) { clearTimeout(timer); timer = 0; }
      if (watchdog) { clearTimeout(watchdog); watchdog = 0; }
      closeStream();
      paintMd(mdEl, acc, false);

      if (state === 'ok') {
        if (!acc.trim()) {
          // 服务端已计入本轮但正文为空：以服务端为准，重新拉一次历史
          renderHistory(active).catch(function () {});
        } else if (usage) {
          var line = usageLine(usage);
          if (line) {
            var meta = el('div', 'meta');
            meta.appendChild(el('span', null, line));
            body.appendChild(meta);
          }
        }
      } else {
        var box = el('div', 'errbox');
        var label = state === 'cancelled' ? '已取消'
          : state === 'interrupted' ? '本轮被中断'
          : '本轮失败';
        box.appendChild(el('div', 'h', label));
        box.appendChild(el('div', 'b', detail || '模型调用失败。'));
        body.appendChild(box);
      }

      busy = false;
      $('#send').textContent = '发送';
      $('#send').classList.add('primary');
      $('#send').classList.remove('stop');
      $('#messages').setAttribute('aria-busy', 'false');
      setStatus(state === 'ok' || state === 'cancelled' ? 'ready' : 'error',
        state === 'ok' ? '就绪' : state === 'cancelled' ? '已取消本轮' : (detail || '本轮失败'));
      loadSessions(true);
    }
    abortTurn = finish;

    var es = new EventSource(api + '/sessions/' + encodeURIComponent(active) + '/events?from_sequence=' + lastSeq);
    source = es;

    function seqOf(ev) {
      var d = safeParse(ev.data) || {};
      var seq = Number(d.sequence || 0);
      return { data: d, seq: seq };
    }
    // 浏览器自动重连会重放已消费的事件，按 sequence 去重后才不会重复拼接正文
    function fresh(seq) {
      if (seq && seq <= lastSeq) return false;
      if (seq) lastSeq = seq;
      return true;
    }

    es.addEventListener('model.stream.delta', function (ev) {
      var p = seqOf(ev);
      if (!fresh(p.seq)) return;
      bump();
      var t = p.data.payload && p.data.payload.text;
      if (t) { acc += t; schedule(); }
      toBottom();
    });

    es.addEventListener('model.completed', function (ev) {
      var p = seqOf(ev);
      if (!fresh(p.seq)) return;
      bump();
      var u = p.data.payload && p.data.payload.usage;
      if (u && typeof u === 'object' && !usage) usage = u;
    });

    es.addEventListener('conversation.turn.completed', function (ev) {
      var p = seqOf(ev);
      if (!fresh(p.seq)) return;
      finish('ok');
    });

    // agent.turn.completed 是本轮唯一的权威终态：ok / failed / cancelled / interrupted
    // 失败、取消、网关重启都不会发 conversation.turn.completed，只等它必定空等到超时
    es.addEventListener('agent.turn.completed', function (ev) {
      var p = seqOf(ev);
      if (!fresh(p.seq)) return;
      var st = (p.data.payload && p.data.payload.status) || 'ok';
      if (st === 'ok') finish('ok');
      else if (st === 'cancelled') finish('cancelled');
      else if (st === 'interrupted') finish('interrupted', '本轮被中断，本机服务可能重启过。');
      else finish('failed', (p.data.payload && p.data.payload.reason_code) || '');
    });

    es.addEventListener('agent.failed', function (ev) {
      var p = seqOf(ev);
      if (!fresh(p.seq)) return;
      var e = (p.data.payload && p.data.payload.error) || {};
      finish('failed', [e.message || '模型调用失败', e.code].filter(Boolean).join('（') + (e.code ? '）' : ''));
    });

    var opened = false;
    var guard = 0;
    var rejectConnect = function () {};

    // readyState 为 CONNECTING 时浏览器会自行重连，靠 sequence 去重即可，什么都不做；
    // 只有流被彻底关掉才是终态——注意连接阶段和连接之后必须共用这一个判定，
    // 否则「先连上、后断开」会永远等不到 finish。
    es.onerror = function () {
      if (es.readyState !== EventSource.CLOSED) return;
      if (guard) { clearTimeout(guard); guard = 0; }
      rejectConnect(new Error('本机事件流连接中断。'));
      finish('failed', opened ? '本机事件流已断开。' : '本机事件流连接中断。');
    };

    try {
      await new Promise(function (resolve, reject) {
        rejectConnect = reject;
        guard = setTimeout(function () { reject(new Error('本机事件流连接超时。')); }, 10000);
        es.onopen = function () { opened = true; if (guard) { clearTimeout(guard); guard = 0; } resolve(); };
      });
    } catch (e) {
      finish('failed', e.message);
      return;
    }
    if (finished) return;

    bump();
    try {
      var r = await command('message.send', { content: text, requested_action: 'chat' }, active);
      if (r && r.status && r.status !== 'accepted') {
        finish('failed', '本机服务未接受本轮：' + r.status);
      }
    } catch (e) {
      finish('failed', e.message);
    }
  }

  async function cancelTurn() {
    if (!busy) return;
    var f = abortTurn;
    try { await command('turn.cancel', {}, active); } catch (e) { /* 取消失败也立即恢复界面 */ }
    if (f) f('cancelled', '已请求停止本轮。');
  }

  /* ---------- 事件绑定 ---------- */

  $('#form').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (busy) return;
    if (!active) { newChat(); return; }
    var input = $('#input');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    autoGrow();
    stick = true;
    $('#messages').appendChild(turnNode('user', text));
    scrollEl.scrollTop = scrollEl.scrollHeight;
    await runTurn(text);
  });

  $('#send').addEventListener('click', function (e) {
    if (!busy) return;
    e.preventDefault();
    cancelTurn();
  });

  $('#input').addEventListener('input', autoGrow);
  $('#input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $('#form').requestSubmit();
    }
  });

  $('#new').addEventListener('click', newChat);

  $('#refresh').addEventListener('click', async function () {
    if (busy || !active) return;
    try {
      await renderHistory(active);
      setStatus('ready', '已重新加载');
    } catch (e) {
      setStatus('error', e.message);
    }
  });

  $('#settings').addEventListener('click', openConfig);
  $('#closeConfig').addEventListener('click', closeConfig);

  $('#kind').addEventListener('change', function () {
    var v = $('#kind').value;
    $('#baseUrl').value = v === 'ollama' ? 'http://127.0.0.1:11434/v1'
      : v === 'glm' ? 'https://open.bigmodel.cn/api/paas/v4' : '';
  });

  $('#probe').addEventListener('click', async function () {
    var id = $('#profileId').value.trim();
    var out = $('#probeOut');
    if (!id) return;
    out.hidden = false;
    out.replaceChildren(el('div', null, '正在探测…'));
    try {
      var r = await raw('/providers/' + encodeURIComponent(id) + '/probe', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ model: $('#modelName').value.trim() || null })
      });
      var body = await readBody(r);
      if (!r.ok) throw fail(body.data, r.status);
      var d = body.data || {};
      var caps = d.capabilities && typeof d.capabilities === 'object'
        ? Object.keys(d.capabilities).filter(function (k) { return d.capabilities[k]; }) : [];
      out.replaceChildren();
      out.appendChild(el('div', 'k', '状态：' + (d.status || '未知') + (d.kind ? '（' + d.kind + '）' : '')));
      if (d.message) out.appendChild(el('div', null, d.message));
      if (caps.length) out.appendChild(el('div', null, '能力：' + caps.join('、')));
      if (d.secret_env_var) out.appendChild(el('div', 'dim', '密钥环境变量：' + d.secret_env_var));
    } catch (e) {
      out.replaceChildren(el('div', 'dim', e.status === 404 ? '该 Profile 尚未保存到本机。' : e.message));
    }
  });

  $('#configForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var kind = $('#kind').value;
    var id = $('#profileId').value.trim();
    var url = $('#baseUrl').value.trim();
    var model = $('#modelName').value.trim();
    var key = $('#apiKey').value;
    var note = $('#cfgStatus');
    note.textContent = '正在保存…';
    try {
      var payload = {
        profile_id: id,
        display_name: $('#displayName').value.trim(),
        protocol: kind === 'ollama' ? 'local' : 'openai_compatible',
        base_url: url,
        default_model: model,
        models: [model],
        api_key: key || null
      };
      var r = await raw('/providers/' + encodeURIComponent(id), {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var body = await readBody(r);
      if (!r.ok) throw fail(body.data, r.status);

      r = await raw('/providers/default', {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ role: 'tutor.default', profile_id: id, model: model })
      });
      body = await readBody(r);
      if (!r.ok) throw fail(body.data, r.status);

      profiles = await get('/providers');
      $('#apiKey').value = '';
      note.textContent = '';
      closeConfig();
      await loadProviders();
      $('#provider').value = id;
      await loadModels(id, model);
      setStatus('ready', '已配置 ' + id + ' / ' + model);
    } catch (err) {
      note.textContent = err.message;
    }
  });

  /* ---------- 侧栏与快捷键 ---------- */

  function setNav(open) {
    document.body.classList.toggle('nav-open', !!open);
    $('#menu').setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  $('#menu').addEventListener('click', function () {
    setNav(!document.body.classList.contains('nav-open'));
  });
  $('#scrim').addEventListener('click', function () { setNav(false); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var dlg = $('#config');
      if (dlg && dlg.open) return; // 交给 dialog 自己关闭
      if (busy) { cancelTurn(); return; }
      setNav(false);
      return;
    }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) {
      e.preventDefault();
      $('#form').requestSubmit();
    }
  });

  /* ---------- 启动 ---------- */

  async function start() {
    applyTheme();
    autoGrow();
    if (!SERVED) {
      // 直接打开本地文件：一次请求都不用发，直接说清怎么办
      setStatus('error', '本页需通过 deepprof web 打开');
      showEmpty(NOT_SERVED);
      return;
    }
    try {
      if (!(await loadProviders())) { showEmpty(); return; }
      var picked = await get('/providers/default');
      if (picked && profiles.some(function (p) { return p.profile_id === picked.profile_id; })) {
        $('#provider').value = picked.profile_id;
        await loadModels(picked.profile_id, picked.model || '');
      }
      var chats = await loadSessions();
      if (chats && chats.length) await selectSession(chats[0].session_id);
      else showEmpty();
      if (!busy && chats !== null) setStatus('ready', '就绪');
    } catch (e) {
      setStatus('error', e.message);
      showEmpty(e.message);
    }
  }

  start();
})();
</script>
</body>
</html>
