name: Bug report
description: Report a reproducible problem in DeepProf.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, student answers, local databases, or raw model replies.
  - type: input
    id: version
    attributes:
      label: DeepProf version
      placeholder: 0.6.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js/Python versions, and relevant provider mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and expected behavior; redact private data.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed result
    validations:
      required: true
