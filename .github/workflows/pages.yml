name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble the public site
        run: |
          mkdir -p site/media
          cp index.html site/index.html
          cp -R media/. site/media/
          touch site/.nojekyll
          test -s site/index.html
          test -s site/media/hero.png
          test -s site/media/logo.svg
          test -s site/media/banner-zh.png
          test -s site/media/banner-en.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
