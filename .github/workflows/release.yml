name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (for example v0.6.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve existing release tag
        id: release-meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/cli/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK test font
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -o addopts= -q
      - name: Verify M3 without paid model calls
        run: python -m evaluation.m3_acceptance --run-id "m3-release-${{ github.run_id }}-${{ github.run_attempt }}" --output-dir "${{ runner.temp }}/deepprof-m3-release"
      - run: npm ci --prefix apps/cli
      - run: npm run typecheck --prefix apps/cli
      - run: npm run pack:release --prefix apps/cli
      - name: Verify the committed research assets
        run: |
          test -s docs/experiments/M1-M3-experimental-report.pdf
          test -s docs/experiments/M1-M3-实验报告.md
          test -s docs/experiments/releases/M1-M3-evidence.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
          .release/deepprof-cli-0.6.2.tgz \
            .release/deepprof-cli-0.6.2.sha256 \
            .release/DEEPPROF-v0.6.2-SHA256SUMS.txt \
            docs/experiments/releases/M1-M3-SHA256SUMS.txt \
            docs/experiments/M1-M3-experimental-report.pdf \
            docs/experiments/M1-M3-实验报告.md \
            docs/experiments/releases/M1-M3-evidence.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "DeepProf $GITHUB_REF_NAME — M1–M3 experiment report" \
            --notes-file .github/RELEASE_NOTES.md
      - name: Smoke test the published npx package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          npm exec --yes --package="https://github.com/RockeyRoc/DeepProf/releases/download/$RELEASE_TAG/deepprof-cli-0.6.2.tgz" -- deepprof --version
